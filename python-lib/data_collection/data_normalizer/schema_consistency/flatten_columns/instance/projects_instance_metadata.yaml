# Required columns for SILVER flattening
# Object: projects / module: instance_metadata
#
# Note: `client.list_projects()` is collected with prefix base `projects_`
# (method name `list_projects` -> category `projects`).
# `project_key` is canonicalized by SILVER normalization.

# Project identity
- project_key
- projects_name
- projects_projecttype
- projects_projectapptype

# User / access context
- projects_ownerlogin

# Governance / ownership
- projects_ownerdisplayname

# Core status / classification
- projects_permissionsversion
- projects_commitmode
- projects_tutorialproject

# Versioning
- projects_versiontag_versionnumber
- projects_versiontag_lastmodifiedon
- projects_versiontag_lastmodifiedby_login
- projects_creationtag_versionnumber
- projects_creationtag_lastmodifiedon
- projects_creationtag_lastmodifiedby_login
