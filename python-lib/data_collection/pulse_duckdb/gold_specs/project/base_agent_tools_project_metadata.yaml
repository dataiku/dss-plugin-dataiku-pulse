base_agent_tools_project_metadata:
  description: >
    Latest snapshot of agent (tools_project_metadata) per key.

    This table is materialized by ranking all observations by run_ts
    and keeping the newest row for each (instance_name, project_key, agent_tools_id).

  depends_on: []
  build_order: 10

  category: agent_tools
  module: project_metadata

  template: latest_by_partition
  base_table_name: base_agent_tools_project_metadata
  view_table_name: v_agent_tools__project_metadata
  partition_keys:
    - instance_name
    - project_key
    - agent_tools_id
