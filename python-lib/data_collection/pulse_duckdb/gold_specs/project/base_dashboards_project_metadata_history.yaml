base_dashboards_project_metadata_history:
  description: >
    Latest snapshot of dashboards (project_metadata) per key.

    This table is materialized by ranking all observations by run_ts
    and keeping the newest row for each (instance_name, project_key, dashboards_id).

  depends_on: []
  build_order: 10

  category: dashboards
  module: project_metadata

  template: latest_by_partition
  base_table_name: base_dashboards_project_metadata_history
  view_table_name: v_dashboards__project_metadata
  partition_keys:
    - instance_name
    - project_key
    - dashboards_id
