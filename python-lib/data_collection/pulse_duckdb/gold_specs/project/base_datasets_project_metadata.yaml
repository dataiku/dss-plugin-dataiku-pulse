base_datasets_project_metadata:
  description: >
    Latest snapshot of datasets (project_metadata) per key.

    This table is materialized by ranking all observations by run_ts
    and keeping the newest row for each (instance_name, project_key, datasets_name).

  depends_on: []
  build_order: 10

  category: datasets
  module: project_metadata

  template: latest_by_partition
  base_table_name: base_datasets_project_metadata
  view_table_name: v_datasets__project_metadata
  partition_keys:
    - instance_name
    - project_key
    - datasets_name
