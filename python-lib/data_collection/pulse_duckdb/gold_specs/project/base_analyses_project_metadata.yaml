base_analyses_project_metadata:
  description: >
    Latest snapshot of analyses (project_metadata) per key.

    This table is materialized by ranking all observations by run_ts
    and keeping the newest row for each (instance_name, project_key, analyses_analysisid).

  depends_on: []
  build_order: 10

  category: analyses
  module: project_metadata

  template: latest_by_partition
  base_table_name: base_analyses_project_metadata
  view_table_name: v_analyses__project_metadata
  partition_keys:
    - instance_name
    - project_key
    - analyses_analysisid
