base_agent_tools_project_metadata_history:
  description: >
    Latest snapshot of agent (tools_project_metadata) per key.

    This table is materialized by ranking all observations by run_ts
    and keeping the newest row for each (instance_name, project_key, agent_tools_id).

  depends_on: []
  build_order: 10

  category: agent
  module: tools_project_metadata

  template: latest_by_partition
  base_table_name: base_agent_tools_project_metadata_history
  view_table_name: v_agent__tools_project_metadata
  partition_keys:
    - instance_name
    - project_key
    - agent_tools_id
