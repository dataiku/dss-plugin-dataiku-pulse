base_managed_folders_project_metadata:
  description: >
    Latest snapshot of managed (folders_project_metadata) per key.

    This table is materialized by ranking all observations by run_ts
    and keeping the newest row for each (instance_name, project_key, managed_folders_id).

  depends_on: []
  build_order: 10

  category: managed_folders
  module: project_metadata

  template: latest_by_partition
  base_table_name: base_managed_folders_project_metadata
  view_table_name: v_managed_folders__project_metadata
  partition_keys:
    - instance_name
    - project_key
    - managed_folders_id
