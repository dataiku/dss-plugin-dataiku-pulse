base_webapps_project_metadata:
  description: >
    Latest snapshot of webapps (project_metadata) per key.

    This table is materialized by ranking all observations by run_ts
    and keeping the newest row for each (instance_name, project_key, webapps_id).

  depends_on: []
  build_order: 10

  category: webapps
  module: project_metadata

  template: latest_by_partition
  base_table_name: base_webapps_project_metadata
  view_table_name: v_webapps__project_metadata
  partition_keys:
    - instance_name
    - project_key
    - webapps_id
