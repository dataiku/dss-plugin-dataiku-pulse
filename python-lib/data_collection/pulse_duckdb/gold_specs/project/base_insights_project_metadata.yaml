base_insights_project_metadata:
  description: >
    Latest snapshot of insights (project_metadata) per key.

    This table is materialized by ranking all observations by run_ts
    and keeping the newest row for each (instance_name, project_key, insights_id).

  depends_on: []
  build_order: 10

  category: insights
  module: project_metadata

  template: latest_by_partition
  base_table_name: base_insights_project_metadata
  view_table_name: v_insights__project_metadata
  partition_keys:
    - instance_name
    - project_key
    - insights_id
