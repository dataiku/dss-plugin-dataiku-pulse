base_scenarios_project_metadata_history:
  description: >
    Latest snapshot of scenarios per instance/project/scenario id.

    This table is materialized by ranking all scenario observations by run_ts
    and keeping the newest row for each (instance_name, project_key, scenarios_id).

  depends_on: []
  build_order: 10

  sql: |
    CREATE OR REPLACE TABLE base_scenarios_project_metadata_history AS
    WITH ranked AS (
      SELECT
        *,
        ROW_NUMBER() OVER (
          PARTITION BY instance_name, project_key, scenarios_id
          ORDER BY run_ts DESC, partition_date DESC
        ) AS rn
      FROM v_scenarios__project_metadata
    )
    SELECT
      * EXCLUDE (rn)
    FROM ranked
    WHERE rn = 1;
