base_scenarios_project_metadata_latest:
  description: >
    Latest snapshot of scenarios per instance/project/scenario id.

    Defined as the most recently observed row per scenario, ordered by run_ts.

  depends_on:
    - base_scenarios_project_metadata_history
  build_order: 20

  sql: |
    CREATE OR REPLACE TABLE base_scenarios_project_metadata_latest AS
    WITH ranked AS (
      SELECT
        *,
        ROW_NUMBER() OVER (
          PARTITION BY instance_name, project_key, scenarios_id
          ORDER BY run_ts DESC, partition_date DESC
        ) AS rn
      FROM base_scenarios_project_metadata_history
    )
    SELECT
      * EXCLUDE (rn)
    FROM ranked
    WHERE rn = 1;
