base_scenarios_metadata_latest:
  description: >
    Scenario "latest" table derived from `base_scenarios_metadata_history`.

    Because collection can be incremental (projects delta), this table is defined as:
    - filter to scenarios whose created/updated timestamps are within the last 7 days
    - then pick the latest observed row per scenario (by partition_date/run_ts)

  depends_on:
    - base_scenarios_metadata_history
  build_order: 20

  sql: |
    CREATE OR REPLACE TABLE base_scenarios_metadata_latest AS
    WITH enriched AS (
      SELECT
        *,
        COALESCE(
          GREATEST(scenario_created_at, scenario_updated_at),
          CAST(partition_date AS TIMESTAMP),
          CAST(run_ts AS TIMESTAMP)
        ) AS scenario_last_change_at
      FROM base_scenarios_metadata_history
    ),
    filtered AS (
      SELECT *
      FROM enriched
      WHERE scenario_last_change_at >= (now() - INTERVAL '7 days')
    ),
    ranked AS (
      SELECT
        *,
        ROW_NUMBER() OVER (
          PARTITION BY instance_name, project_key, scenario_id
          ORDER BY scenario_last_change_at DESC, partition_date DESC, run_ts DESC
        ) AS rn
      FROM filtered
    )
    SELECT
      instance_name,
      project_key,
      scenario_id,
      scenario_name,
      scenario_type,
      scenario_active,
      scenario_run_as_login,
      scenario_created_at,
      scenario_updated_at,
      scenario_next_run,
      scenario_last_run_start,
      scenario_running,
      run_ts,
      extras,
      partition_date
    FROM ranked
    WHERE rn = 1;
