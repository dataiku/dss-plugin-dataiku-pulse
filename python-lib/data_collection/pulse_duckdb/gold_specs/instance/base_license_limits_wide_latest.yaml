base_license_limits_wide_latest:
  description: >
    Latest wide license-limit snapshot per instance.

    This table pivots known main license and sublicense profile limits into
    nullable per-instance columns while preserving the long-form max-license
    table as the source of truth for evolving profile vocabularies.

  depends_on:
    - base_license_status_latest
    - base_license_max_licenses_latest
  build_order: 20

  sql: |
    CREATE OR REPLACE TABLE base_license_limits_wide_latest AS
    WITH status AS (
      SELECT *
      FROM base_license_status_latest
    ),
    max_licenses AS (
      SELECT *
      FROM base_license_max_licenses_latest
    )
    SELECT
      status.*{wide_columns}
    FROM status
    LEFT JOIN max_licenses
      ON status.instance_name = max_licenses.instance_name
    GROUP BY ALL;
