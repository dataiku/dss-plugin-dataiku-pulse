base_code_envs_instance_metadata_history:
  description: >
    Latest snapshot of code (envs_instance_metadata) per key.

    This table is materialized by ranking all observations by run_ts
    and keeping the newest row for each (instance_name, code_envs_envname, code_envs_envlang).

  depends_on: []
  build_order: 10

  category: code
  module: envs_instance_metadata

  template: latest_by_partition
  base_table_name: base_code_envs_instance_metadata_history
  view_table_name: v_code__envs_instance_metadata
  partition_keys:
    - instance_name
    - code_envs_envname
    - code_envs_envlang
