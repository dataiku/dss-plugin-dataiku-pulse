base_projects_instance_metadata:
  description: >
    Latest snapshot of projects (instance_metadata) per key.

    This table is materialized by ranking all observations by run_ts
    and keeping the newest row for each (instance_name, project_key).

  depends_on: []
  build_order: 10

  category: projects
  module: instance_metadata

  template: latest_by_partition
  base_table_name: base_projects_instance_metadata
  view_table_name: v_projects__instance_metadata
  partition_keys:
    - instance_name
    - project_key
