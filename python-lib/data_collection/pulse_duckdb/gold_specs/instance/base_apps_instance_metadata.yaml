base_apps_instance_metadata:
  description: >
    Latest snapshot of apps (instance_metadata) per key.

    This table is materialized by ranking all observations by run_ts
    and keeping the newest row for each (instance_name, apps_appid).

  depends_on: []
  build_order: 10

  category: apps
  module: instance_metadata

  template: latest_by_partition
  base_table_name: base_apps_instance_metadata
  view_table_name: v_apps__instance_metadata
  partition_keys:
    - instance_name
    - apps_appid
