base_workspaces_instance_metadata:
  description: >
    Latest snapshot of workspaces (instance_metadata) per key.

    This table is materialized by ranking all observations by run_ts
    and keeping the newest row for each (instance_name, workspaces_workspacekey).

  depends_on: []
  build_order: 10

  category: workspaces
  module: instance_metadata

  template: latest_by_partition
  base_table_name: base_workspaces_instance_metadata
  view_table_name: v_workspaces__instance_metadata
  partition_keys:
    - instance_name
    - workspaces_workspacekey
