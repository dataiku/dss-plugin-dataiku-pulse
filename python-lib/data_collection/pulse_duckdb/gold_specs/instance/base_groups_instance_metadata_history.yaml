base_groups_instance_metadata_history:
  description: >
    Latest snapshot of groups (instance_metadata) per key.

    This table is materialized by ranking all observations by run_ts
    and keeping the newest row for each (instance_name, groups_name).

  depends_on: []
  build_order: 10

  category: groups
  module: instance_metadata

  template: latest_by_partition
  base_table_name: base_groups_instance_metadata_history
  view_table_name: v_groups__instance_metadata
  partition_keys:
    - instance_name
    - groups_name
