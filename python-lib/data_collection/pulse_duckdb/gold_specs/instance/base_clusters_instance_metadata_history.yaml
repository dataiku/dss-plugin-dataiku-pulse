base_clusters_instance_metadata_history:
  description: >
    Latest snapshot of clusters (instance_metadata) per key.

    This table is materialized by ranking all observations by run_ts
    and keeping the newest row for each (instance_name, clusters_id).

  depends_on: []
  build_order: 10

  category: clusters
  module: instance_metadata

  template: latest_by_partition
  base_table_name: base_clusters_instance_metadata_history
  view_table_name: v_clusters__instance_metadata
  partition_keys:
    - instance_name
    - clusters_id
