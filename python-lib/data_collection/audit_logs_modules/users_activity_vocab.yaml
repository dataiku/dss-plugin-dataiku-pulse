# Vocabulary for classifying *developing* actions from audit logs.
#
# Logic (mirrors legacy pulse_modules/domain/audit_log/user_login.py):
# - developing action: msgType contains any `action_words` AND does NOT contain any `remove_words`
# - viewing action: any retained UI action row (developing is a subset)

action_words:
  - save
  - create
  - analysis
  - clear
  - run
  - edit
  - update
  - upload
  - import
  - export
  - build
  - train
  - deploy
  - publish
  - execute
  - compute
  - recipe
  - scenario
  - notebook
  - webapp
  - dashboard
  - api
  - app
  - flow
  - plugin
  - code-env
  - codeenv
  - settings
  - rename
  - delete
  - move
  - copy
  - duplicate
  - sync
  - git
  - commit
  - schema
  - partition

remove_words:
  - list
  - dataset-clear-samples
  - dataset-save-schema
  - project-save-variables
  - get
  - read
  - open
  - preview
  - view
  - explore
  - sample
  - status
  - summary
  - timeline
  - search
  - recent
  - details
  - read-meta
  - read-data
  - read-schema
