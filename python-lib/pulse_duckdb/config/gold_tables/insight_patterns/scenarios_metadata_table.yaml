scenarios_metadata_table:
  description: >
    Deduplicated scenario metadata per instance + project + scenario.
    Keeps exactly one row per scenario based on the most recent
    scenarios_lastModifiedOn, with deterministic tie-breaking.
    Optimized to avoid full-history window scans.
  depends_on:
    - scenarios_metadata_view
  build_order: 20
  full_sql: |
    CREATE OR REPLACE TABLE scenarios_metadata_base AS
    WITH latest_ts AS (
        SELECT
            instance_name,
            project_key,
            scenarios_id,
            MAX(scenarios_lastModifiedOn) AS max_modified
        FROM scenarios_metadata_view
        GROUP BY
            instance_name,
            project_key,
            scenarios_id
    ),
    filtered AS (
        SELECT v.*
        FROM scenarios_metadata_view v
        JOIN latest_ts l
          ON v.instance_name = l.instance_name
         AND v.project_key = l.project_key
         AND v.scenarios_id = l.scenarios_id
         AND v.scenarios_lastModifiedOn = l.max_modified
    ),
    ranked AS (
        SELECT
            *,
            ROW_NUMBER() OVER (
                PARTITION BY
                    instance_name,
                    project_key,
                    scenarios_id
                ORDER BY
                    scenarios_lastModifiedOn DESC,
                    scenarios_createdOn DESC
            ) AS rn
        FROM filtered
    )
    SELECT
        instance_name,
        project_key,
        scenarios_id,
        scenarios_name,
        scenarios_type,
        scenarios_active,
        scenarios_unavailable,
        scenarios_running,
        scenarios_markedAsTest,
        scenarios_createdOn,
        scenarios_lastModifiedOn,
        scenarios_start,
        scenarios_nextRun,
        scenarios_runAsUser
    FROM ranked
    WHERE rn = 1;
