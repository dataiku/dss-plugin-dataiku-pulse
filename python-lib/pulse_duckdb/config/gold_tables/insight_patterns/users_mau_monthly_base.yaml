users_mau_monthly:
  description: >
    Monthly Active Users (MAU) aggregated by calendar month and instance.
    Counts distinct licensed, enabled, non-trial users who performed
    VIEWER or DEVELOPMENT Studio activity within the month.
    Built from deduplicated activity and metadata base tables to ensure
    clean KPI-grade aggregation suitable for executive reporting.
  depends_on:
    - users_user_login_activity_base
    - users_metadata_base
  build_order: 90
  full_sql: |
    CREATE OR REPLACE TABLE users_mau_monthly_base AS
    SELECT
        DATE_TRUNC('month', a.timestamp) AS month,
        a.instance_name,
        COUNT(DISTINCT a.login) AS mau
    FROM users_user_login_activity_base a
    JOIN users_metadata_base m
        ON a.instance_name = m.instance_name
        AND a.login = m.login
    WHERE
        a.activity_type IN ('VIEWER', 'DEVELOPMENT')
        AND m.enabled = TRUE
        AND m.resultingUserProfile NOT IN ('READER', 'AI_CONSUMER')
        AND COALESCE(m.trial_exists, FALSE) = FALSE
    GROUP BY
        DATE_TRUNC('month', a.timestamp),
        a.instance_name
    ORDER BY
        DATE_TRUNC('month', a.timestamp),
        a.instance_name;