projects_metadata_table:
  description: >
    Deduplicated project metadata per instance + project.
    Keeps exactly one row per project based on the most recent
    project_versionTag_lastModifiedOn, with deterministic tie-breaking.
    Optimized to avoid full-history window scans.
  depends_on:
    - projects_metadata_view
  build_order: 20
  full_sql: |
    CREATE OR REPLACE TABLE projects_metadata_base AS
    WITH latest_ts AS (
        SELECT
            instance_name,
            project_key,
            MAX(project_versionTag_lastModifiedOn) AS max_modified
        FROM projects_metadata_view
        GROUP BY
            instance_name,
            project_key
    ),
    filtered AS (
        SELECT v.*
        FROM projects_metadata_view v
        JOIN latest_ts l
          ON v.instance_name = l.instance_name
         AND v.project_key = l.project_key
         AND v.project_versionTag_lastModifiedOn = l.max_modified
    ),
    ranked AS (
        SELECT
            *,
            ROW_NUMBER() OVER (
                PARTITION BY
                    instance_name,
                    project_key
                ORDER BY
                    project_versionTag_versionNumber DESC,
                    project_creationTag_versionNumber DESC
            ) AS rn
        FROM filtered
    )
    SELECT
        instance_name,
        project_key,
        login,
        project_projectType,
        project_projectAppType,
        project_permissionsVersion,
        project_tutorialProject,
        project_commitMode,
        project_name,
        project_ownerDisplayName,
        project_versionTag_versionNumber,
        project_versionTag_lastModifiedOn,
        project_versionTag_lastModifiedBy_login,
        project_creationTag_versionNumber,
        project_creationTag_lastModifiedOn,
        project_creationTag_lastModifiedBy_login
    FROM ranked
    WHERE rn = 1;
