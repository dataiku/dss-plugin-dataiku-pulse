recipes_metadata_table:
  description: >
    Deduplicated recipe metadata per instance + project + recipe.
    Keeps exactly one row per recipe based on the most recent
    recipes_versionTag_lastModifiedOn, with deterministic tie-breaking.
    Optimized to avoid full-history window scans.
  depends_on:
    - recipes_metadata_view
  build_order: 20
  full_sql: |
    CREATE OR REPLACE TABLE recipes_metadata_base AS
    WITH latest_ts AS (
        SELECT
            instance_name,
            project_key,
            recipes_name,
            MAX(recipes_versionTag_lastModifiedOn) AS max_modified
        FROM recipes_metadata_view
        GROUP BY
            instance_name,
            project_key,
            recipes_name
    ),
    filtered AS (
        SELECT v.*
        FROM recipes_metadata_view v
        JOIN latest_ts l
          ON v.instance_name = l.instance_name
         AND v.project_key = l.project_key
         AND v.recipes_name = l.recipes_name
         AND v.recipes_versionTag_lastModifiedOn = l.max_modified
    ),
    ranked AS (
        SELECT
            *,
            ROW_NUMBER() OVER (
                PARTITION BY
                    instance_name,
                    project_key,
                    recipes_name
                ORDER BY
                    recipes_versionTag_versionNumber DESC,
                    recipes_creationTag_versionNumber DESC
            ) AS rn
        FROM filtered
    )
    SELECT
        instance_name,
        project_key,
        recipes_name,
        recipes_type,
        recipes_neverRecomputeExistingPartitions,
        recipes_redispatchPartitioning,
        recipes_maxRunningActivities,
        recipes_hashPropagationBehavior,
        recipes_versionTag_versionNumber,
        recipes_versionTag_lastModifiedBy_login,
        recipes_versionTag_lastModifiedOn,
        recipes_creationTag_versionNumber,
        recipes_creationTag_lastModifiedBy_login,
        recipes_creationTag_lastModifiedOn,
        recipes_params_engineType,
        recipes_params_engineLabel,
        recipes_params_engineRecommended
    FROM ranked
    WHERE rn = 1;
