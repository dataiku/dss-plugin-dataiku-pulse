datasets_metadata_table:
  description: >
    Deduplicated dataset metadata per instance + project + dataset.
    Keeps exactly one row per dataset based on the most recent
    dataset_versionTag_lastModifiedOn, with deterministic tie-breaking.
    Optimized to avoid full-history window scans.
  depends_on:
    - datasets_metadata_view
  build_order: 20
  full_sql: |
    CREATE OR REPLACE TABLE datasets_metadata_base AS
    WITH latest_ts AS (
        SELECT
            instance_name,
            project_key,
            dataset_name,
            MAX(dataset_versionTag_lastModifiedOn) AS max_modified
        FROM datasets_metadata_view
        GROUP BY
            instance_name,
            project_key,
            dataset_name
    ),
    filtered AS (
        SELECT v.*
        FROM datasets_metadata_view v
        JOIN latest_ts l
          ON v.instance_name = l.instance_name
         AND v.project_key = l.project_key
         AND v.dataset_name = l.dataset_name
         AND v.dataset_versionTag_lastModifiedOn = l.max_modified
    ),
    ranked AS (
        SELECT
            *,
            ROW_NUMBER() OVER (
                PARTITION BY
                    instance_name,
                    project_key,
                    dataset_name
                ORDER BY
                    dataset_versionTag_versionNumber DESC,
                    dataset_creationTag_versionNumber DESC
            ) AS rn
        FROM filtered
    )
    SELECT
        instance_name,
        project_key,
        dataset_type,
        dataset_managed,
        dataset_featureGroup,
        dataset_name,
        dataset_typeSystemVersion,
        dataset_versionTag_versionNumber,
        dataset_versionTag_lastModifiedBy_login,
        dataset_versionTag_lastModifiedOn,
        dataset_creationTag_versionNumber,
        dataset_creationTag_lastModifiedBy_login,
        dataset_creationTag_lastModifiedOn,
        dataset_smartName
    FROM ranked
    WHERE rn = 1;
