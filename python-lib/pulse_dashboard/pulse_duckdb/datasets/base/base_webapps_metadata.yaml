base_webapps_metadata:
  description: >
    Webapp inventory (DSS webapps) across instances.
  depends_on: []
  build_order: 150
  sql: |
    CREATE OR REPLACE TABLE "base_webapps_metadata" AS
    WITH ranked AS (
      SELECT
        instance_name,
        project_key,
        webapps_id AS webapp_id,
        webapps_name AS webapp_name,
        webapps_type AS webapp_type,
        COALESCE(
          NULLIF(TRIM(CAST(webapps_createdby_login AS VARCHAR)), ''),
          NULLIF(TRIM(CAST(webapps_lastmodifiedby_login AS VARCHAR)), '')
        ) AS owner_login,
        CASE
          WHEN NULLIF(TRIM(CAST(webapps_createdon AS VARCHAR)), '') IS NULL THEN NULL
          WHEN regexp_matches(NULLIF(TRIM(CAST(webapps_createdon AS VARCHAR)), ''), '^[0-9]{13}$') THEN to_timestamp(try_cast(NULLIF(TRIM(CAST(webapps_createdon AS VARCHAR)), '') AS DOUBLE) / 1000.0)
          WHEN regexp_matches(NULLIF(TRIM(CAST(webapps_createdon AS VARCHAR)), ''), '^[0-9]{10}$') THEN to_timestamp(try_cast(NULLIF(TRIM(CAST(webapps_createdon AS VARCHAR)), '') AS DOUBLE))
          ELSE try_cast(webapps_createdon AS TIMESTAMP)
        END AS created_at,
        CASE
          WHEN NULLIF(TRIM(CAST(webapps_lastmodifiedon AS VARCHAR)), '') IS NULL THEN NULL
          WHEN regexp_matches(NULLIF(TRIM(CAST(webapps_lastmodifiedon AS VARCHAR)), ''), '^[0-9]{13}$') THEN to_timestamp(try_cast(NULLIF(TRIM(CAST(webapps_lastmodifiedon AS VARCHAR)), '') AS DOUBLE) / 1000.0)
          WHEN regexp_matches(NULLIF(TRIM(CAST(webapps_lastmodifiedon AS VARCHAR)), ''), '^[0-9]{10}$') THEN to_timestamp(try_cast(NULLIF(TRIM(CAST(webapps_lastmodifiedon AS VARCHAR)), '') AS DOUBLE))
          ELSE try_cast(webapps_lastmodifiedon AS TIMESTAMP)
        END AS updated_at,
        webapps_lastmodifiedby_login AS last_modified_by_login,
        ROW_NUMBER() OVER (
          PARTITION BY instance_name, project_key, webapps_id
          ORDER BY try_cast(run_ts AS TIMESTAMP) DESC NULLS LAST, partition_date DESC NULLS LAST
        ) AS rn
      FROM base_webapps_project_metadata_history
    )
    SELECT
      instance_name,
      project_key,
      webapp_id,
      webapp_name,
      webapp_type,
      owner_login,
      created_at,
      updated_at,
      last_modified_by_login
    FROM ranked
    WHERE rn = 1;
  example_data: |
    INSERT INTO "base_webapps_metadata" (instance_name, project_key, webapp_id, webapp_name, webapp_type, owner_login, created_at, updated_at, last_modified_by_login) VALUES ('dss-prod', 'FIN', 'webapp_id_example', 'webapp_name_example', 'webapp_type_example', 'alice', TIMESTAMP '2026-03-23 12:00:00', TIMESTAMP '2026-03-23 12:00:00', 'alice');
