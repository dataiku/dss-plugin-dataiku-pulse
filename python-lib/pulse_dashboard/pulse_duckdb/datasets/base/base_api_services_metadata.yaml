base_api_services_metadata:
  description: >
    Inventory of API services across DSS instances, collapsed to the latest row per identity.
  depends_on: []
  build_order: 25
  sql: |
    CREATE OR REPLACE TABLE "base_api_services_metadata" AS
    WITH ranked AS (
      SELECT
        instance_name,
        project_key,
        api_services_id,
        api_services_name,
        api_services_type,
        CAST(NULL AS VARCHAR) AS owner_login,
        CAST(NULL AS VARCHAR) AS last_modified_by_login,
        CASE
          WHEN NULLIF(TRIM(CAST(api_services_createdon AS VARCHAR)), '') IS NULL THEN NULL
          WHEN regexp_matches(NULLIF(TRIM(CAST(api_services_createdon AS VARCHAR)), ''), '^[0-9]{13}$') THEN to_timestamp(try_cast(NULLIF(TRIM(CAST(api_services_createdon AS VARCHAR)), '') AS DOUBLE) / 1000.0)
          WHEN regexp_matches(NULLIF(TRIM(CAST(api_services_createdon AS VARCHAR)), ''), '^[0-9]{10}$') THEN to_timestamp(try_cast(NULLIF(TRIM(CAST(api_services_createdon AS VARCHAR)), '') AS DOUBLE))
          ELSE try_cast(api_services_createdon AS TIMESTAMP)
        END AS created_at,
        CASE
          WHEN NULLIF(TRIM(CAST(api_services_lastmodifiedon AS VARCHAR)), '') IS NULL THEN NULL
          WHEN regexp_matches(NULLIF(TRIM(CAST(api_services_lastmodifiedon AS VARCHAR)), ''), '^[0-9]{13}$') THEN to_timestamp(try_cast(NULLIF(TRIM(CAST(api_services_lastmodifiedon AS VARCHAR)), '') AS DOUBLE) / 1000.0)
          WHEN regexp_matches(NULLIF(TRIM(CAST(api_services_lastmodifiedon AS VARCHAR)), ''), '^[0-9]{10}$') THEN to_timestamp(try_cast(NULLIF(TRIM(CAST(api_services_lastmodifiedon AS VARCHAR)), '') AS DOUBLE))
          ELSE try_cast(api_services_lastmodifiedon AS TIMESTAMP)
        END AS updated_at,
        CAST(extras AS VARCHAR) AS details_json,
        ROW_NUMBER() OVER (
          PARTITION BY instance_name, project_key, api_services_id
          ORDER BY try_cast(run_ts AS TIMESTAMP) DESC NULLS LAST, partition_date DESC NULLS LAST
        ) AS rn
      FROM base_api_services_project_metadata_history
    )
    SELECT
      instance_name,
      project_key,
      api_services_id,
      api_services_name,
      api_services_type,
      owner_login,
      last_modified_by_login,
      created_at,
      updated_at,
      details_json
    FROM ranked
    WHERE rn = 1;
