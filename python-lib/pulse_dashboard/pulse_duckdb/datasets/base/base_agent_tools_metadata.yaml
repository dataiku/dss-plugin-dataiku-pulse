base_agent_tools_metadata:
  description: >
    Inventory of agent tools across DSS instances, collapsed to the latest row per identity.
  depends_on: []
  build_order: 15
  sql: |
    CREATE OR REPLACE TABLE "base_agent_tools_metadata" AS
    WITH ranked AS (
      SELECT
        instance_name,
        project_key,
        agent_tools_id,
        agent_tools_name,
        agent_tools_type,
        CAST(NULL AS VARCHAR) AS owner_login,
        CAST(NULL AS VARCHAR) AS last_modified_by_login,
        CAST(NULL AS TIMESTAMP) AS created_at,
        CAST(NULL AS TIMESTAMP) AS updated_at,
        CAST(extras AS VARCHAR) AS details_json,
        ROW_NUMBER() OVER (
          PARTITION BY instance_name, project_key, agent_tools_id
          ORDER BY try_cast(run_ts AS TIMESTAMP) DESC NULLS LAST, partition_date DESC NULLS LAST
        ) AS rn
      FROM base_agent_tools_project_metadata
    )
    SELECT
      instance_name,
      project_key,
      agent_tools_id,
      agent_tools_name,
      agent_tools_type,
      owner_login,
      last_modified_by_login,
      created_at,
      updated_at,
      details_json
    FROM ranked
    WHERE rn = 1;
