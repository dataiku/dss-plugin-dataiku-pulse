fact_dev_activity_events:
  description: >
    Event-level table used by **Build → Development Activity**.
  depends_on: []
  build_order: 170
  sql: |
    CREATE OR REPLACE TABLE "fact_dev_activity_events" AS
    SELECT
          CAST(NULL AS TIMESTAMP) AS timestamp,
          CAST(NULL AS VARCHAR) AS instance_name,
          CAST(NULL AS VARCHAR) AS login,
          CAST(NULL AS VARCHAR) AS msgtype,
          CAST(NULL AS VARCHAR) AS msgtypebase,
          CAST(NULL AS VARCHAR) AS dataiku_category,
          CAST(NULL AS VARCHAR) AS project_key,
          CAST(NULL AS VARCHAR) AS callpath,
          CAST(NULL AS VARCHAR) AS extras,
          CAST(NULL AS TIMESTAMP) AS run_timestamp
    WHERE 1=0;
  example_data: |
    INSERT INTO "fact_dev_activity_events" (timestamp, instance_name, login, msgtype, msgtypebase, dataiku_category, project_key, severity, topic, audittopic, callpath, extras) VALUES (TIMESTAMP '2026-03-23 12:00:00', 'dss-prod', 'alice', 'msgtype_example', 'msgtypebase_example', 'dataiku_category_example', 'FIN', 'severity_example', 'topic_example', 'audittopic_example', 'callpath_example', 'extras_example');
