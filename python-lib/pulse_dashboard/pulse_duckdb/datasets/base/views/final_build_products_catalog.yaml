final_build_products_catalog:
  description: >
    This document describes the DuckDB view(s) needed to power **Build → Products → Catalog**.

    This catalog view is downstream of the live `base_product_index` view in
    DuckDB. In environments where the config-driven product registry builder
    succeeds, `base_product_index` is generated dynamically from
    `python-lib/pulse_dashboard/configs/product_structure.yaml`; otherwise the
    static fallback definition in `datasets/views/base_product_index.yaml` may
    be used instead.
  depends_on: []
  build_order: 1120
  sql: |
    CREATE OR REPLACE VIEW "final_build_products_catalog" AS
    WITH idx AS (
      SELECT * FROM base_product_index
    ),
    act AS (
      SELECT * FROM product_activity_30d
    )
    SELECT
      md5(concat_ws('|', idx.instance_name, idx.project_key, idx.product_type, idx.product_key)) AS product_id,
      idx.instance_name,
      idx.project_key,
      idx.product_type,
      idx.product_key,
      idx.product_name,
      idx.product_subtype,
      idx.owner_login,
      idx.last_modified_by_login,
      idx.created_at,
      idx.updated_at,
      COALESCE(act.activity_30d, 0) AS activity_30d,
      COALESCE(act.active_users_30d, 0) AS active_users_30d,
      act.last_activity_at,
      p.project_name
    FROM idx
    LEFT JOIN act
      ON act.instance_name = idx.instance_name
     AND act.project_key = idx.project_key
     AND act.product_type = idx.product_type
     AND act.product_key = idx.product_key
    LEFT JOIN (
      SELECT
        instance_name,
        project_key,
        project_name
      FROM base_projects_metadata
    ) p
      ON p.instance_name = idx.instance_name
     AND p.project_key = idx.project_key;
  example_data: |
    -- This object is a VIEW.
    -- Insert example rows into its upstream base tables.
