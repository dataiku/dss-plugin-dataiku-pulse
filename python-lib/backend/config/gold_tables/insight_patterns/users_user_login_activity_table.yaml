users_user_login_activity_table:
  description: >
    Daily deduplicated user login activity per instance and login.
    Keeps one activity record per user per day, selecting the latest
    timestamp when multiple ingestion runs exist.
  depends_on:
    - users_user_login_activity_view

  full_sql: |
    CREATE OR REPLACE TABLE users_user_login_activity_base AS
    WITH ranked_activity AS (
        SELECT
            instance_name,
            login,
            activity_type,
            timestamp,
            DATE(timestamp) AS activity_date,
            ROW_NUMBER() OVER (
                PARTITION BY
                    instance_name,
                    login,
                    activity_type,
                    DATE(timestamp)
                ORDER BY
                    timestamp DESC
            ) AS rn
        FROM users_user_login_activity_view
    )
    SELECT
        instance_name,
        login,
        activity_type,
        timestamp
    FROM ranked_activity
    WHERE rn = 1
    ORDER BY
        instance_name,
        login,
        timestamp;

  incremental_sql: |
    CREATE OR REPLACE TABLE users_user_login_activity_base AS
    WITH recent_activity AS (
        SELECT
            instance_name,
            login,
            activity_type,
            timestamp
        FROM users_user_login_activity_view
        WHERE
            timestamp >= CURRENT_DATE - INTERVAL 7 DAY
    ),
    existing_gold AS (
        SELECT
            instance_name,
            login,
            activity_type,
            timestamp
        FROM users_user_login_activity_base
        WHERE
            timestamp < CURRENT_DATE - INTERVAL 7 DAY
    ),
    combined AS (
        SELECT * FROM existing_gold
        UNION ALL
        SELECT * FROM recent_activity
    ),
    ranked_activity AS (
        SELECT
            instance_name,
            login,
            activity_type,
            timestamp,
            DATE(timestamp) AS activity_date,
            ROW_NUMBER() OVER (
                PARTITION BY
                    instance_name,
                    login,
                    activity_type,
                    DATE(timestamp)
                ORDER BY
                    timestamp DESC
            ) AS rn
        FROM combined
    )
    SELECT
        instance_name,
        login,
        activity_type,
        timestamp
    FROM ranked_activity
    WHERE rn = 1
    ORDER BY
        instance_name,
        login,
        timestamp;
