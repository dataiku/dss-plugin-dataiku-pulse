<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Dataiku Pulse Dashboard</title>

    <script>
      // DSS packages webapps with an HTML body and a JS stub.
      // Our React build lives under the plugin `resource/` directory and uses hashed filenames.
      // Load the build manifest at runtime and inject the right JS/CSS entrypoints.

      function injectCss(href) {
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = href;
        document.head.appendChild(link);
      }

      function injectScript(src) {
        var script = document.createElement("script");
        script.defer = true;
        script.src = src;
        document.head.appendChild(script);
      }

      async function loadPulseFrontend() {
        try {
          // Relative to the webapp base URL; DSS serves plugin resources under `../resource/`.
          var manifestUrl = "../resource/pulse-dashboard/build/asset-manifest.json";
          var res = await fetch(manifestUrl, { cache: "no-cache" });
          if (!res.ok) {
            throw new Error("Failed to load asset manifest: " + res.status + " " + res.statusText);
          }

          var manifest = await res.json();
          var entrypoints = manifest.entrypoints || [];

          // CRA `entrypoints` are like: ["static/css/main.<hash>.css", "static/js/main.<hash>.js"].
          for (var i = 0; i < entrypoints.length; i++) {
            var relPath = entrypoints[i];
            var url = "../resource/pulse-dashboard/build/" + relPath;

            if (relPath.endsWith(".css")) {
              injectCss(url);
            } else if (relPath.endsWith(".js")) {
              injectScript(url);
            }
          }
        } catch (e) {
          var el = document.getElementById("pulse-loader-error");
          if (el) {
            el.textContent = String(e);
          }
        }
      }

      loadPulseFrontend();
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <pre id="pulse-loader-error" style="color: #b00020; white-space: pre-wrap;"></pre>
  </body>
</html>
