<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Dataiku Pulse Dashboard</title>

    <style>
      /*
        UI polish overrides for the built frontend.
        We keep these in `body.html` so we don't hand-edit generated assets under
        `resource/pulse-dashboard/build/`.

        The Development Activity "Top capability / category" labels can be long
        and were visually clipped by the bar column.
      */
      .PulseBarRow {
        grid-template-columns: minmax(180px, 260px) 1fr 44px !important;
      }
    </style>

    <script>
      // DSS packages webapps with an HTML body and a JS stub.
      // Our React build lives under the plugin `resource/` directory and uses hashed filenames.
      // Load the build manifest at runtime and inject the right JS/CSS entrypoints.

      function injectCss(href) {
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = href;
        document.head.appendChild(link);
      }

      function injectScript(src) {
        var script = document.createElement("script");
        script.defer = true;
        script.src = src;
        document.head.appendChild(script);
      }

      function buildManifestCandidates() {
        // The exact URL that serves plugin `resource/` files can vary depending on DSS version
        // and reverse-proxy setup. Try a few relative locations until we get valid JSON.
        var urls = [];
        for (var i = 0; i <= 6; i++) {
          var prefix = i === 0 ? "" : "../".repeat(i);
          urls.push(prefix + "resource/pulse-dashboard/build/asset-manifest.json");
        }
        return urls;
      }

      async function fetchManifest() {
        var candidates = buildManifestCandidates();
        var lastError = null;

        for (var i = 0; i < candidates.length; i++) {
          var url = candidates[i];
          try {
            var res = await fetch(url, { cache: "no-cache" });
            if (!res.ok) {
              lastError = new Error("HTTP " + res.status + " for " + url);
              continue;
            }

            // If DSS returns an HTML error page, res.json() will throw.
            var manifest = await res.json();
            if (manifest && manifest.entrypoints) {
              return { manifest: manifest, manifestUrl: url };
            }

            lastError = new Error("Invalid manifest JSON at " + url);
          } catch (e) {
            lastError = e;
          }
        }

        if (lastError) {
          throw lastError;
        }
        throw new Error("Failed to locate asset-manifest.json");
      }

      function setupHashLinkInterceptor() {
        // In DSS, the webapp "View" URL often ends with a path segment
        // (no trailing slash). Relative links like "./#about" then resolve
        // to the parent path and DSS loads a different page.
        //
        // The React app uses hash routing, so we can safely intercept same-page
        // hash navigation and update window.location.hash without reloading.
        document.addEventListener('click', function (e) {
          var a = e.target && e.target.closest ? e.target.closest('a') : null;
          if (!a) return;

          var href = a.getAttribute('href');
          if (!href) return;
          if (a.getAttribute('target') === '_blank') return;

          // Fast-path for the links generated by the Pulse navbar.
          if (href === './' || href === '#') {
            e.preventDefault();
            if (window.location.hash) window.location.hash = '';
            return;
          }

          if (href.startsWith('./#')) {
            e.preventDefault();
            window.location.hash = href.slice(2); // keep leading '#'
            return;
          }

          if (href.startsWith('#')) {
            e.preventDefault();
            window.location.hash = href;
            return;
          }
        });
      }

      // In DSS, the supported way to reach the backend is
      // `dataiku.getWebAppBackendUrl(<path>)` which returns the full proxied URL.
      // We wait briefly for the `dataiku` JS object to be injected.
      function sleep(ms) {
        return new Promise(function (resolve) {
          setTimeout(resolve, ms);
        });
      }

      async function waitForDataiku(timeoutMs) {
        var start = Date.now();
        while (Date.now() - start < timeoutMs) {
          if (window.dataiku && typeof window.dataiku.getWebAppBackendUrl === "function") {
            return true;
          }
          await sleep(50);
        }
        return false;
      }

      function getWebAppBackendUrl(path) {
        // In DSS, use the proxied backend URL.
        // In local dev / reverse-proxy setups, fall back to a discovered base URL.
        if (!window.dataiku || typeof window.dataiku.getWebAppBackendUrl !== "function") {
          var rel = String(path || "").replace(/^\//, "");

          var base = String(window.__PULSE_BACKEND_BASE || "");
          if (!base) {
            // Last-resort: build from current location.
            base = String(window.location.origin || "") + String(window.location.pathname || "/");
          }

          if (base && !base.endsWith("/")) base = base + "/";

          try {
            return String(new URL(rel, base));
          } catch (e) {
            return rel;
          }
        }

        // DSS versions differ on whether the leading slash is accepted.
        var rel = String(path || "").replace(/^\//, "");
        var candidates = [rel, "/" + rel];

        for (var i = 0; i < candidates.length; i++) {
          try {
            var u = String(window.dataiku.getWebAppBackendUrl(candidates[i]) || "");
            if (u) return u;
          } catch (e) {
            // try next
          }
        }
        return "";
      }

      function pulseApiUrl(path) {
        return getWebAppBackendUrl(String(path || "").replace(/^\.?\/?/, "api/"));
      }
      async function loadPulseFrontend() {
        try {
          setupHashLinkInterceptor();

          // In DSS, `window.dataiku` can take a moment to be injected.
          // If we don't wait long enough, we fall back to `/api/...` URLs which
          // hit the DSS/nginx root and 404.
          var hasDataiku = await waitForDataiku(10000);
          if (!hasDataiku) {
            try {
              console.warn("Pulse: dataiku JS API not detected; probing backend base URL");
            } catch (e) {
              // ignore
            }
          }

          async function discoverBackendBase() {
            // In DSS, we can always ask `dataiku` for the proxied URL.
            if (window.dataiku && typeof window.dataiku.getWebAppBackendUrl === "function") {
              return String(window.dataiku.getWebAppBackendUrl("/__ping") || "").replace(/\/__ping\/?$/, "");
            }

            // Outside DSS (or when dataiku JS isn't injected), we may still be
            // behind a reverse proxy. Try a few candidates and keep the first
            // one that responds.
            var candidates = [];

            // 1) Same origin, assume the backend is mounted at the same path.
            candidates.push(String(window.location.origin || "") + String(window.location.pathname || ""));

            // 2) Try trimming one segment.
            var parts = String(window.location.pathname || "").split("/").filter(Boolean);
            if (parts.length >= 1) {
              candidates.push(String(window.location.origin || "") + "/" + parts.slice(0, -1).join("/") + "/");
            }

            // 3) Code Studio / platform port proxy conventions.
            // (These are same-origin so cookies/auth are included.)
            candidates.push(String(window.location.origin || "") + "/proxy/8995/");
            candidates.push(String(window.location.origin || "") + "/-/proxy/8995/");
            candidates.push(String(window.location.origin || "") + "/_proxy/8995/");

            // 4) Direct local-dev URL (only works if the browser can reach it).
            candidates.push("http://localhost:8995/");

            for (var i = 0; i < candidates.length; i++) {
              var base = String(candidates[i] || "");
              if (!base) continue;
              if (!base.endsWith("/")) base = base + "/";

              try {
                var res = await fetch(base + "__ping", { cache: "no-cache" });
                if (res && res.ok) {
                  return base;
                }
              } catch (e) {
                // try next
              }
            }

            return "";
          }

          try {
            var discovered = await discoverBackendBase();
            if (discovered) {
              window.__PULSE_BACKEND_BASE = discovered;
            }
          } catch (e) {
            // ignore
          }



          var root = document.getElementById("root");
          if (root) {
            root.innerHTML =
              '<div style="font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding: 24px;">' +
              '<div style="font-size: 18px; font-weight: 600;">Initializing Pulse data…</div>' +
              '<div style="margin-top: 8px; color: #555;">Loading DuckDB and GOLD tables. This can take a moment on first start.</div>' +
              '<div style="margin-top: 12px; font-size: 12px; color: #777;">If this hangs, check the webapp backend logs or use the debug reload endpoint.</div>' +
              '</div>';
          }


          async function warmupDuckdb() {
            try {
              var warmupUrl = pulseApiUrl("startup/duckdb");
              if (!warmupUrl) {
                return { ok: false, error: "Backend URL not available" };
              }


              var res = await fetch(warmupUrl, { cache: "no-cache" });
              if (!res.ok) {
                var text = "";
                try {
                  text = await res.text();
                } catch (e) {
                  // ignore
                }
                return {
                  ok: false,
                  error: "DuckDB init failed (HTTP " + res.status + ")" + (text ? "\n" + text : ""),
                };
              }

              return await res.json();
            } catch (e) {
              return { ok: false, error: String(e) };
            }
          }

          var warmup = await warmupDuckdb();
          if (!warmup || warmup.ok !== true) {
            var msg = warmup && warmup.error ? String(warmup.error) : "DuckDB initialization failed";
            var el = document.getElementById("pulse-loader-error");
            if (el) {
              el.textContent = msg;
            }
            return;
          }

          if (root && warmup.durationSec != null) {
            root.innerHTML =
              root.innerHTML +
              '<div style="margin-top: 8px; font-size: 12px; color: #777;">DuckDB init completed in ' +
              String(warmup.durationSec) +
              "s</div>";
          }

          // Optional: fetch a read-only status snapshot for display.
          try {
            var statusUrl = pulseApiUrl("startup/status");
            if (statusUrl) {
              var stRes = await fetch(statusUrl, { cache: "no-cache" });
              if (stRes.ok) {
                var st = await stRes.json();
                if (root && st && st.ok === true && st.duckdb) {
                  var details = [];
                  if (st.ready === true) details.push("ready");
                  if (st.duckdb.path) details.push(st.duckdb.path);
                  if (st.tables && st.tables.length != null) details.push(String(st.tables.length) + " tables");
                  if (details.length) {
                    root.innerHTML =
                      root.innerHTML +
                      '<div style="margin-top: 4px; font-size: 12px; color: #777;">Status: ' +
                      details.join(" · ") +
                      "</div>";
                  }
                }
              }
            }
          } catch (e) {
            // best-effort only
          }

          window.__PULSE_RUNTIME_CONFIG = {
            backendBaseUrl: String(window.__PULSE_BACKEND_BASE || ""),
            apiBaseUrl: pulseApiUrl(""),
            getApiUrl: pulseApiUrl,
          };

          var r = await fetchManifest();
          var manifest = r.manifest;
          var manifestUrl = r.manifestUrl;


          var baseUrl = manifestUrl.replace(/asset-manifest\.json$/, "");
          var entrypoints = manifest.entrypoints || [];

          // CRA `entrypoints` are like: ["static/css/main.<hash>.css", "static/js/main.<hash>.js"].
          for (var i = 0; i < entrypoints.length; i++) {
            var relPath = entrypoints[i].replace(/^\.\//, "");
            var url = baseUrl + relPath;

            if (relPath.endsWith(".css")) {
              injectCss(url);
            } else if (relPath.endsWith(".js")) {
              injectScript(url);
            }
          }
        } catch (e) {
          var el = document.getElementById("pulse-loader-error");
          if (el) {
            el.textContent = String(e);
          }
        }
      }

      loadPulseFrontend();
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <pre id="pulse-loader-error" style="color: #b00020; white-space: pre-wrap;"></pre>
  </body>
</html>
