<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Dataiku Pulse Dashboard</title>

    <style>
      /*
        UI polish overrides for the built frontend.
        We keep these in `body.html` so we don't hand-edit generated assets under
        `resource/pulse-dashboard/build/`.

        The Development Activity "Top capability / category" labels can be long
        and were visually clipped by the bar column.
      */
      .PulseBarRow {
        grid-template-columns: minmax(180px, 260px) 1fr 44px !important;
      }
    </style>

    <script>
      // DSS packages webapps with an HTML body and a JS stub.
      // Our React build lives under the plugin `resource/` directory and uses hashed filenames.
      // Load the build manifest at runtime and inject the right JS/CSS entrypoints.

      function injectCss(href) {
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = href;
        document.head.appendChild(link);
      }

      function injectScript(src) {
        var script = document.createElement("script");
        script.defer = true;
        script.src = src;
        document.head.appendChild(script);
      }

      function buildManifestCandidates() {
        // The exact URL that serves plugin `resource/` files can vary depending on DSS version
        // and reverse-proxy setup. Try a few relative locations until we get valid JSON.
        var urls = [];
        for (var i = 0; i <= 6; i++) {
          var prefix = i === 0 ? "" : "../".repeat(i);
          urls.push(prefix + "resource/pulse-dashboard/build/asset-manifest.json");
        }
        return urls;
      }

      async function fetchManifest() {
        var candidates = buildManifestCandidates();
        var lastError = null;

        for (var i = 0; i < candidates.length; i++) {
          var url = candidates[i];
          try {
            var res = await fetch(url, { cache: "no-cache" });
            if (!res.ok) {
              lastError = new Error("HTTP " + res.status + " for " + url);
              continue;
            }

            // If DSS returns an HTML error page, res.json() will throw.
            var manifest = await res.json();
            if (manifest && manifest.entrypoints) {
              return { manifest: manifest, manifestUrl: url };
            }

            lastError = new Error("Invalid manifest JSON at " + url);
          } catch (e) {
            lastError = e;
          }
        }

        if (lastError) {
          throw lastError;
        }
        throw new Error("Failed to locate asset-manifest.json");
      }

      function setupHashLinkInterceptor() {
        // In DSS, the webapp "View" URL often ends with a path segment
        // (no trailing slash). Relative links like "./#about" then resolve
        // to the parent path and DSS loads a different page.
        //
        // The React app uses hash routing, so we can safely intercept same-page
        // hash navigation and update window.location.hash without reloading.
        document.addEventListener('click', function (e) {
          var a = e.target && e.target.closest ? e.target.closest('a') : null;
          if (!a) return;

          var href = a.getAttribute('href');
          if (!href) return;
          if (a.getAttribute('target') === '_blank') return;

          // Fast-path for the links generated by the Pulse navbar.
          if (href === './' || href === '#') {
            e.preventDefault();
            if (window.location.hash) window.location.hash = '';
            return;
          }

          if (href.startsWith('./#')) {
            e.preventDefault();
            window.location.hash = href.slice(2); // keep leading '#'
            return;
          }

          if (href.startsWith('#')) {
            e.preventDefault();
            window.location.hash = href;
            return;
          }
        });
      }

      // In DSS, the supported way to reach the backend is
      // `dataiku.getWebAppBackendUrl(<path>)` which returns the full proxied URL.
      // We wait briefly for the `dataiku` JS object to be injected.
      function sleep(ms) {
        return new Promise(function (resolve) {
          setTimeout(resolve, ms);
        });
      }

      function setLoaderSpinnerDone() {
        var el = document.getElementById("pulse-loader-spinner");
        if (!el) return;
        el.style.animation = "none";
        el.style.borderColor = "#bbf7d0";
        el.style.borderTopColor = "#16a34a";
      }

      async function waitForDataiku(timeoutMs) {
        var start = Date.now();
        while (Date.now() - start < timeoutMs) {
          if (window.dataiku && typeof window.dataiku.getWebAppBackendUrl === "function") {
            return true;
          }
          await sleep(50);
        }
        return false;
      }

      function getWebAppBackendUrl(path) {
        // In DSS, use the proxied backend URL.
        // In local dev / reverse-proxy setups, fall back to a discovered base URL.
        if (!window.dataiku || typeof window.dataiku.getWebAppBackendUrl !== "function") {
          var rel = String(path || "").replace(/^\//, "");

          var base = String(window.__PULSE_BACKEND_BASE || "");
          if (!base) {
            // Last-resort: build from current location.
            base = String(window.location.origin || "") + String(window.location.pathname || "/");
          }

          if (base && !base.endsWith("/")) base = base + "/";

          try {
            return String(new URL(rel, base));
          } catch (e) {
            return rel;
          }
        }

        // DSS versions differ on whether the leading slash is accepted.
        var rel = String(path || "").replace(/^\//, "");
        var candidates = [rel, "/" + rel];

        for (var i = 0; i < candidates.length; i++) {
          try {
            var u = String(window.dataiku.getWebAppBackendUrl(candidates[i]) || "");
            if (u) return u;
          } catch (e) {
            // try next
          }
        }
        return "";
      }

      function pulseApiUrl(path) {
        return getWebAppBackendUrl(String(path || "").replace(/^\.?\/?/, "api/"));
      }

      function setLoaderMessage(html) {
        var el = document.getElementById("pulse-loader-message");
        if (el) {
          el.innerHTML = html;
        }
      }

      function setLoaderMeta(text) {
        var el = document.getElementById("pulse-loader-meta");
        if (el) {
          el.textContent = text || "";
        }
      }

      var pulseLoaderLiveMeta = {
        dbPath: "",
        startedAt: null,
        durationSec: null,
        error: "",
        lastStatusAt: null,
      };
      var _startupInitState = null;

      function renderLoaderMetaFromState() {
        var details = [];
        if (pulseLoaderLiveMeta.dbPath) details.push(String(pulseLoaderLiveMeta.dbPath));

        var overallElapsedSec = null;
        if (pulseLoaderLiveMeta.startedAt != null) {
          overallElapsedSec = Math.max(0, Date.now() / 1000 - Number(pulseLoaderLiveMeta.startedAt));
        } else if (pulseLoaderLiveMeta.durationSec != null) {
          overallElapsedSec = Number(pulseLoaderLiveMeta.durationSec);
        }

        if (overallElapsedSec != null) details.push("elapsed: " + formatElapsedSeconds(overallElapsedSec));
        if (pulseLoaderLiveMeta.lastStatusAt != null) {
          var sinceStatusSec = Math.max(0, Date.now() / 1000 - Number(pulseLoaderLiveMeta.lastStatusAt));
          details.push("last update: " + formatElapsedSeconds(sinceStatusSec) + " ago");
        }
        if (pulseLoaderLiveMeta.error) details.push(String(pulseLoaderLiveMeta.error));
        setLoaderMeta(details.join(" · "));
      }

      function setLoaderStep(step, state) {
        var el = document.getElementById("pulse-step-" + step);
        if (!el) return;
        var palette = {
          pending: { bg: "#f8fafc", fg: "#475569", border: "rgba(148,163,184,0.18)" },
          active: { bg: "#dbeafe", fg: "#1d4ed8", border: "rgba(37,99,235,0.22)" },
          done: { bg: "#dcfce7", fg: "#166534", border: "rgba(34,197,94,0.22)" },
          error: { bg: "#fee2e2", fg: "#b91c1c", border: "rgba(239,68,68,0.22)" },
        };
        var chosen = palette[state] || palette.pending;
        el.style.background = chosen.bg;
        el.style.color = chosen.fg;
        el.style.borderColor = chosen.border;
      }

      async function fetchInitStatus() {
        try {
          var url = pulseApiUrl("startup/init-status");
          if (!url) return null;
          var res = await fetch(url, { cache: "no-cache" });
          if (!res.ok) return null;
          return await res.json();
        } catch (e) {
          return null;
        }
      }

      function formatElapsedSeconds(seconds) {
        var rounded = Math.max(0, Math.round(Number(seconds) || 0));
        if (rounded < 60) return String(rounded) + "s";
        var minutes = Math.floor(rounded / 60);
        var secs = rounded % 60;
        if (secs === 0) return String(minutes) + "m";
        return String(minutes) + "m " + String(secs) + "s";
      }

      function loaderSubstepsForPhase(phase) {
        var items = [
          { key: "waiting_lock", label: "Waiting for the reload lock" },
          { key: "preparing_db", label: "Preparing the local DuckDB file" },
          { key: "preparing_reload", label: "Opening DuckDB for reload" },
          { key: "listing_gold", label: "Finding GOLD datasets to load" },
          { key: "loading_gold", label: "Loading GOLD datasets into DuckDB" },
          { key: "inventory_views", label: "Creating compatibility views" },
          { key: "seeding_demo", label: "Seeding demo data when needed" },
          { key: "building_views", label: "Building Pulse dashboard views" },
        ];

        var currentIndex = -1;
        for (var i = 0; i < items.length; i++) {
          if (items[i].key === phase) {
            currentIndex = i;
            break;
          }
        }

        return items.map(function (item, index) {
          var state = "pending";
          if (phase === "frontend_ready") {
            state = "done";
          } else if (phase === "failed" || phase === "unavailable") {
            if (currentIndex >= 0 && index < currentIndex) state = "done";
            else if (currentIndex === index) state = "error";
          } else if (currentIndex >= 0) {
            if (index < currentIndex) state = "done";
            else if (index === currentIndex) state = "active";
          }
          return { label: item.label, state: state };
        });
      }

      function renderLoaderSubsteps(phase) {
        var el = document.getElementById("pulse-loader-substeps");
        if (!el) return;

        var items = loaderSubstepsForPhase(String(phase || "idle"));
        el.innerHTML = items
          .map(function (item) {
            var color = item.state === "done"
              ? "#166534"
              : item.state === "active"
                ? "#1d4ed8"
                : item.state === "error"
                  ? "#b91c1c"
                  : "#64748b";
            var bullet = item.state === "done"
              ? "✓"
              : item.state === "active"
                ? "•"
                : item.state === "error"
                  ? "!"
                  : "○";
            return '<div style="display:flex; align-items:center; gap:8px; color:' + color + ';"><span style="font-weight:700; width:12px; text-align:center;">' + bullet + '</span><span>' + item.label + '</span></div>';
          })
          .join("");
      }

      function renderInitStatus(status) {
        if (!status || !status.init) return;
        var init = status.init;
        _startupInitState = init;
        var state = String(init.state || "idle");
        var normalizedState = String(init.normalizedState || "").toUpperCase();
        var phase = String(init.phase || "idle");
        var isReloading = state === "running" || (!init.state && normalizedState === "INITIALIZING");
        var isReady = state === "ready" || (!init.state && normalizedState === "READY");
        var isFailed = state === "failed" || state === "unavailable" || (!init.state && normalizedState === "FAILED");

        if (isReloading || phase === "frontend_ready") {
          setLoaderStep(1, "done");
          if (phase === "frontend_ready") {
            setLoaderStep(2, "done");
            setLoaderStep(3, "done");
          } else {
            setLoaderStep(2, "active");
            setLoaderStep(3, "pending");
          }
        } else if (isReady) {
          setLoaderStep(1, "done");
          setLoaderStep(2, "done");
          setLoaderStep(3, "active");
        } else if (isFailed) {
          setLoaderStep(1, "done");
          setLoaderStep(2, "error");
          setLoaderStep(3, "pending");
        } else {
          setLoaderStep(1, "active");
          setLoaderStep(2, "pending");
          setLoaderStep(3, "pending");
        }

        if (init.message) {
          if (isReloading) {
            setLoaderMessage(
              "Welcome to Pulse. We’re refreshing the analytics database so your dashboard opens with the latest data."
            );
          } else {
            setLoaderMessage(String(init.message));
          }
        }

        renderLoaderSubsteps(phase);

        pulseLoaderLiveMeta.dbPath = init.dbPath ? String(init.dbPath) : "";
        pulseLoaderLiveMeta.startedAt = init.startedAt != null ? Number(init.startedAt) : null;
        pulseLoaderLiveMeta.durationSec = init.durationSec != null ? Number(init.durationSec) : null;
        pulseLoaderLiveMeta.error = init.error ? String(init.error) : "";
        pulseLoaderLiveMeta.lastStatusAt = Date.now() / 1000;
        renderLoaderMetaFromState();

        var titleEl = document.getElementById("pulse-loader-title");
        if (titleEl) {
          titleEl.textContent = phase === "frontend_ready"
            ? "Pulse is ready"
            : isReloading
              ? "Welcome to Pulse"
              : "Pulse is getting things ready";
        }

        var subtitleEl = document.getElementById("pulse-loader-subtitle");
        if (subtitleEl) {
          subtitleEl.textContent = phase === "frontend_ready"
            ? "Analytics are loaded and the dashboard is about to open."
            : isReloading
              ? "Refreshing the analytics layer before opening the dashboard."
              : "Checking backend readiness, preparing data, and loading the dashboard.";
        }

        if (phase === "frontend_ready") {
          setLoaderMessage("Everything is loaded. Opening the Pulse dashboard now.");
          setLoaderSpinnerDone();
        }
      }

      async function loadPulseFrontend() {
        try {
          setupHashLinkInterceptor();

          // In DSS, `window.dataiku` can take a moment to be injected.
          // If we don't wait long enough, we fall back to `/api/...` URLs which
          // hit the DSS/nginx root and 404.
          var hasDataiku = await waitForDataiku(10000);
          if (!hasDataiku) {
            try {
              console.warn("Pulse: dataiku JS API not detected; probing backend base URL");
            } catch (e) {
              // ignore
            }
          }

          async function discoverBackendBase() {
            // In DSS, we can always ask `dataiku` for the proxied URL.
            if (window.dataiku && typeof window.dataiku.getWebAppBackendUrl === "function") {
              return String(window.dataiku.getWebAppBackendUrl("/__ping") || "").replace(/\/__ping\/?$/, "");
            }

            // Outside DSS (or when dataiku JS isn't injected), we may still be
            // behind a reverse proxy. Try a few candidates and keep the first
            // one that responds.
            var candidates = [];

            // 1) Same origin, assume the backend is mounted at the same path.
            candidates.push(String(window.location.origin || "") + String(window.location.pathname || ""));

            // 2) Try trimming one segment.
            var parts = String(window.location.pathname || "").split("/").filter(Boolean);
            if (parts.length >= 1) {
              candidates.push(String(window.location.origin || "") + "/" + parts.slice(0, -1).join("/") + "/");
            }

            // 3) Code Studio / platform port proxy conventions.
            // (These are same-origin so cookies/auth are included.)
            candidates.push(String(window.location.origin || "") + "/proxy/8995/");
            candidates.push(String(window.location.origin || "") + "/-/proxy/8995/");
            candidates.push(String(window.location.origin || "") + "/_proxy/8995/");

            // 4) Direct local-dev URL (only works if the browser can reach it).
            candidates.push("http://localhost:8995/");

            for (var i = 0; i < candidates.length; i++) {
              var base = String(candidates[i] || "");
              if (!base) continue;
              if (!base.endsWith("/")) base = base + "/";

              try {
                var res = await fetch(base + "__ping", { cache: "no-cache" });
                if (res && res.ok) {
                  return base;
                }
              } catch (e) {
                // try next
              }
            }

            return "";
          }

          try {
            var discovered = await discoverBackendBase();
            if (discovered) {
              window.__PULSE_BACKEND_BASE = discovered;
            }
          } catch (e) {
            // ignore
          }



          var root = document.getElementById("root");
          if (root) {
            root.innerHTML =
              '<div style="min-height: 70vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, #f8fbff 0%, #eef4ff 100%); font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding: 24px; box-sizing: border-box;">' +
              '<div style="width: 100%; max-width: 720px; background: rgba(255,255,255,0.92); border: 1px solid rgba(43,108,176,0.12); border-radius: 18px; box-shadow: 0 16px 40px rgba(31,41,55,0.10); padding: 32px;">' +
              '<div style="display: flex; align-items: center; gap: 14px;">' +
              '<div id="pulse-loader-spinner" style="width: 18px; height: 18px; border-radius: 999px; border: 3px solid #c7d7fe; border-top-color: #2b6cb0; animation: pulse-spin 1s linear infinite;"></div>' +
              '<div id="pulse-loader-title" style="font-size: 24px; font-weight: 700; color: #153e75;">Pulse is getting things ready</div>' +
              '</div>' +
              '<div id="pulse-loader-subtitle" style="margin-top: 14px; font-size: 13px; line-height: 1.6; color: #64748b;">Checking the DuckDB startup state before the dashboard loads.</div>' +
              '<div id="pulse-loader-message" style="margin-top: 10px; font-size: 15px; line-height: 1.6; color: #334155;">Checking the Pulse backend and preparing analytics data.</div>' +
              '<div style="margin-top: 18px; display: grid; gap: 10px;">' +
              '<div id="pulse-step-1" style="padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(148,163,184,0.18); background: #f8fafc; color: #1e293b;"><strong>Step 1:</strong> Connecting to the Pulse backend</div>' +
              '<div id="pulse-step-2" style="padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(148,163,184,0.18); background: #f8fafc; color: #1e293b;"><strong>Step 2:</strong> Rebuilding the Pulse analytics database</div>' +
              '<div id="pulse-loader-substeps" style="margin-top: 8px; padding-left: 14px; display: grid; gap: 6px; font-size: 12px; color: #64748b;"></div>' +
              '<div id="pulse-step-3" style="padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(148,163,184,0.18); background: #f8fafc; color: #1e293b;"><strong>Step 3:</strong> Opening the Pulse dashboard</div>' +
              '</div>' +
              '<div id="pulse-loader-meta" style="margin-top: 18px; font-size: 12px; color: #64748b;">You can check the webapp backend logs for progress while initialization runs.</div>' +
              '</div>' +
              '</div>';
          }

          setLoaderStep(1, "active");

          var initPoll = null;
          var liveMetaTimer = window.setInterval(function () {
            renderLoaderMetaFromState();
          }, 1000);
          async function startInitPolling() {
            var stopped = false;
            var run = async function () {
              try {
                var status = await fetchInitStatus();
                renderInitStatus(status);
              } catch (e) {
                try {
                  console.warn("Pulse: init-status polling failed", e);
                } catch (ignore) {
                  // ignore
                }
              }
              if (!stopped) {
                initPoll = window.setTimeout(run, 1500);
              }
            };
            initPoll = {
              stop: function () {
                stopped = true;
              },
            };
            await run();
          }

          await startInitPolling();


          async function waitForDuckdbReady() {
            while (true) {
              var init = _startupInitState;
              if (init) {
                if (init.state === "failed" || init.state === "unavailable" || (!init.state && String(init.normalizedState || "").toUpperCase() === "FAILED")) {
                  return {
                    ok: false,
                    error: init.error || init.message || "DuckDB initialization failed",
                  };
                }
                if (init.state === "ready" || (!init.state && String(init.normalizedState || "").toUpperCase() === "READY")) {
                  return {
                    ok: true,
                    pending: false,
                    durationSec: init.durationSec,
                    load: init.report,
                  };
                }
              }
              await sleep(1500);
            }
          }

          var warmup = await waitForDuckdbReady();
          if (!warmup || warmup.ok !== true) {
            if (initPoll) { if (typeof initPoll.stop === "function") initPoll.stop(); else window.clearTimeout(initPoll); }
            if (liveMetaTimer) window.clearInterval(liveMetaTimer);
            setLoaderStep(2, "error");
            var msg = warmup && warmup.error ? String(warmup.error) : "DuckDB initialization failed";
            var el = document.getElementById("pulse-loader-error");
            if (el) {
              el.textContent = msg;
            }
            return;
          }

          if (initPoll) { if (typeof initPoll.stop === "function") initPoll.stop(); else window.clearTimeout(initPoll); }
          if (liveMetaTimer) window.clearInterval(liveMetaTimer);
          setLoaderStep(1, "done");
          setLoaderStep(2, "done");
          setLoaderStep(3, "done");
          setLoaderSpinnerDone();
          setLoaderMessage("Everything is loaded. Opening the Pulse dashboard now.");
          var titleEl = document.getElementById("pulse-loader-title");
          if (titleEl) titleEl.textContent = "Pulse is ready";
          var subtitleEl = document.getElementById("pulse-loader-subtitle");
          if (subtitleEl) subtitleEl.textContent = "Analytics are loaded and the dashboard is about to open.";

          if (root && warmup.durationSec != null) {
            setLoaderMeta("DuckDB init completed in " + String(warmup.durationSec) + "s");
          }

          await sleep(1000);

          // Optional: fetch a read-only status snapshot for display.
          try {
            var statusUrl = pulseApiUrl("startup/status");
            if (statusUrl) {
              var stRes = await fetch(statusUrl, { cache: "no-cache" });
              if (stRes.ok) {
                var st = await stRes.json();
                if (root && st && st.ok === true && st.duckdb) {
                  var details = [];
                  if (st.ready === true) details.push("ready");
                  if (st.duckdb.path) details.push(st.duckdb.path);
                  if (st.tables && st.tables.length != null) details.push(String(st.tables.length) + " tables");
                  if (details.length) {
                    setLoaderMeta("Status: " + details.join(" · "));
                  }
                }
              }
            }
          } catch (e) {
            // best-effort only
          }

          window.__PULSE_RUNTIME_CONFIG = {
            backendBaseUrl: String(window.__PULSE_BACKEND_BASE || ""),
            apiBaseUrl: pulseApiUrl(""),
            getApiUrl: pulseApiUrl,
          };

          var r = await fetchManifest();
          var manifest = r.manifest;
          var manifestUrl = r.manifestUrl;


          var baseUrl = manifestUrl.replace(/asset-manifest\.json$/, "");
          var entrypoints = manifest.entrypoints || [];

          // CRA `entrypoints` are like: ["static/css/main.<hash>.css", "static/js/main.<hash>.js"].
          for (var i = 0; i < entrypoints.length; i++) {
            var relPath = entrypoints[i].replace(/^\.\//, "");
            var url = baseUrl + relPath;

            if (relPath.endsWith(".css")) {
              injectCss(url);
            } else if (relPath.endsWith(".js")) {
              injectScript(url);
            }
          }
        } catch (e) {
          var el = document.getElementById("pulse-loader-error");
          if (el) {
            el.textContent = String(e);
          }
        }
      }

      loadPulseFrontend();
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <pre id="pulse-loader-error" style="color: #b00020; white-space: pre-wrap;"></pre>
    <style>
      @keyframes pulse-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </body>
</html>
