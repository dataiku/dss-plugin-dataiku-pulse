<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Dataiku Pulse Dashboard</title>

    <script>
      // DSS packages webapps with an HTML body and a JS stub.
      // Our React build lives under the plugin `resource/` directory and uses hashed filenames.
      // Load the build manifest at runtime and inject the right JS/CSS entrypoints.

      function injectCss(href) {
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = href;
        document.head.appendChild(link);
      }

      function injectScript(src) {
        var script = document.createElement("script");
        script.defer = true;
        script.src = src;
        document.head.appendChild(script);
      }

      function buildManifestCandidates() {
        // The exact URL that serves plugin `resource/` files can vary depending on DSS version
        // and reverse-proxy setup. Try a few relative locations until we get valid JSON.
        var urls = [];
        for (var i = 0; i <= 6; i++) {
          var prefix = i === 0 ? "" : "../".repeat(i);
          urls.push(prefix + "resource/pulse-dashboard/build/asset-manifest.json");
        }
        return urls;
      }

      async function fetchManifest() {
        var candidates = buildManifestCandidates();
        var lastError = null;

        for (var i = 0; i < candidates.length; i++) {
          var url = candidates[i];
          try {
            var res = await fetch(url, { cache: "no-cache" });
            if (!res.ok) {
              lastError = new Error("HTTP " + res.status + " for " + url);
              continue;
            }

            // If DSS returns an HTML error page, res.json() will throw.
            var manifest = await res.json();
            if (manifest && manifest.entrypoints) {
              return { manifest: manifest, manifestUrl: url };
            }

            lastError = new Error("Invalid manifest JSON at " + url);
          } catch (e) {
            lastError = e;
          }
        }

        if (lastError) {
          throw lastError;
        }
        throw new Error("Failed to locate asset-manifest.json");
      }

      function setupHashLinkInterceptor() {
        // In DSS, the webapp "View" URL often ends with a path segment
        // (no trailing slash). Relative links like "./#about" then resolve
        // to the parent path and DSS loads a different page.
        //
        // The React app uses hash routing, so we can safely intercept same-page
        // hash navigation and update window.location.hash without reloading.
        document.addEventListener('click', function (e) {
          var a = e.target && e.target.closest ? e.target.closest('a') : null;
          if (!a) return;

          var href = a.getAttribute('href');
          if (!href) return;
          if (a.getAttribute('target') === '_blank') return;

          // Fast-path for the links generated by the Pulse navbar.
          if (href === './' || href === '#') {
            e.preventDefault();
            if (window.location.hash) window.location.hash = '';
            return;
          }

          if (href.startsWith('./#')) {
            e.preventDefault();
            window.location.hash = href.slice(2); // keep leading '#'
            return;
          }

          if (href.startsWith('#')) {
            e.preventDefault();
            window.location.hash = href;
            return;
          }
        });
      }

       async function resolveBackendBaseUrl() {
         // Best-effort backend base URL resolution.
         //
         // In DSS, the supported way to reach the backend is
         // `dataiku.getWebAppBackendUrl(<path>)` which returns the full proxied URL.
         // However, depending on load order, the `dataiku` JS object may not be
         // available immediately, so we wait briefly before falling back to
         // URL pattern probing.

         function sleep(ms) {
           return new Promise(function (resolve) {
             setTimeout(resolve, ms);
           });
         }

         async function waitForDataiku(timeoutMs) {
           var start = Date.now();
           while (Date.now() - start < timeoutMs) {
             if (window.dataiku && typeof window.dataiku.getWebAppBackendUrl === "function") {
               return true;
             }
             await sleep(50);
           }
           return false;
         }

         function getWebAppBackendUrl(path) {
           if (!window.dataiku || typeof window.dataiku.getWebAppBackendUrl !== "function") {
             return "";
           }

           // DSS versions differ on whether the leading slash is accepted.
           var rel = String(path || "");
           rel = rel.replace(/^\//, "");

           var candidates = [rel, "/" + rel];
           for (var i = 0; i < candidates.length; i++) {
             try {
               var u = String(window.dataiku.getWebAppBackendUrl(candidates[i]) || "");
               if (u) return u;
             } catch (e) {
               // try next
             }
           }
           return "";
         }

         try {
           // Give DSS a moment to inject the `dataiku` JS runtime.
           await waitForDataiku(1500);

           // If available, validate the backend URL via `/api/status`.
           var statusUrl = getWebAppBackendUrl("api/status");
           if (statusUrl) {
             try {
               var res0 = await fetch(statusUrl, { cache: "no-cache", credentials: "same-origin" });
               if (res0.ok) {
                 var body0 = await res0.json();
                 if (body0 && (body0.ok || body0.msg || body0.status)) {
                   return statusUrl.replace(/\/?api\/status$/, "");
                 }
               }
             } catch (e) {
               // fall back
             }
           }


          var params = new URLSearchParams(window.location.search || "");
          var projectKey = params.get("projectKey");
          var webAppId = params.get("webAppId");

          // Fallback for vanity URLs like:
          // `/projects/<PROJECT_KEY>/webapps/<WEBAPP_ID>_<LABEL>/view`
          // Note: DSS can be hosted under a path prefix (e.g. `/dataiku`), so don't anchor at `^/projects`.
          if (!projectKey || !webAppId) {
            var m = (window.location.pathname || "").match(/\/projects\/([^/]+)\/webapps\/([^/]+)\/view(?:\/|$)/);
            if (m) {
              projectKey = m[1];
              webAppId = m[2];
            }
          }

          if (!projectKey || !webAppId) {
            return "";
          }

          var pk = encodeURIComponent(projectKey);

          // Vanity URLs use `<id>_<label>` but backend mounts often use `<id>`.
          // Try both forms.
          var webAppIds = [webAppId];
          try {
            if (webAppId && webAppId.indexOf("_") > 0) {
              webAppIds.unshift(webAppId.split("_")[0]);
            }
          } catch (e) {
            // best-effort only
          }

          var origin = window.location.origin;

          // DSS can be hosted behind a path prefix (e.g. `https://host/dataiku/...`).
          // When that's the case, backend URLs must include that prefix.
          var path = window.location.pathname || "";
          var prefix = "";
          try {
            var idx = path.indexOf("/projects/");
            if (idx > 0) {
              prefix = path.slice(0, idx);
            }
          } catch (e) {
            // best-effort only
          }

          // DSS backend mount point differs depending on runtime and version.
          // Probe a small set of known patterns and validate with `/api/status`.
          // Some patterns take the vanity webapp id (`<id>_<label>`), others take the raw id (`<id>`).
          for (var j = 0; j < webAppIds.length; j++) {
            var wid = encodeURIComponent(webAppIds[j]);
            var candidates = [
              origin + prefix + "/dip/api/webapps/backends/" + pk + "/" + wid,
              origin + prefix + "/dip/api/webapps/backends/" + pk + "/" + wid + "/backend",
              origin + prefix + "/dip/api/webapps/backend/" + pk + "/" + wid,
              origin + prefix + "/dip/api/webapps/backend/" + pk + "/" + wid + "/backend",
              origin + prefix + "/dip/api/projects/" + pk + "/webapps/" + wid + "/backend",
              origin + prefix + "/projects/" + pk + "/webapps/" + wid + "/backend"
            ];

            for (var i = 0; i < candidates.length; i++) {
              var base = candidates[i];
              try {
                var res = await fetch(base + "/api/status", { cache: "no-cache", credentials: "same-origin" });
                if (!res.ok) continue;
                var body = await res.json();
                if (body && (body.ok || body.msg || body.status)) {
                  return base;
                }
              } catch (e) {
                // try next
              }
            }
          }
        } catch (e) {
          // best-effort only
        }
        return "";
      }


      async function loadPulseFrontend() {
        try {
          setupHashLinkInterceptor();

          var backendBaseUrl = await resolveBackendBaseUrl();
          if (backendBaseUrl) {
            window.dataiku = window.dataiku || {};
            window.dataiku.getWebAppBackendUrl = function () {
              return backendBaseUrl;
            };
          }

          // Some builds call APIs via absolute `/api/...` paths, which don't work in DSS
          // because the backend is mounted under a project/webapp-specific prefix.
          // Rewrite those requests to hit the webapp backend base URL.
          (function patchApiCalls() {
            function getBackendBaseUrl() {
              try {
                if (window.dataiku && typeof window.dataiku.getWebAppBackendUrl === "function") {
                  var existing = String(window.dataiku.getWebAppBackendUrl() || "").replace(/\/$/, "");
                  if (existing) return existing;
                }
              } catch (e) {
                // best-effort only
              }
              return backendBaseUrl || "";
            }

            function rewriteUrl(url) {
              if (!url) return url;
              if (typeof url !== "string") return url;

              if (url.startsWith("/api/")) {
                var base = getBackendBaseUrl();
                if (base) return base + url;
              }
              return url;
            }

            // Patch `fetch`.
            try {
              if (window.fetch) {
                var originalFetch = window.fetch.bind(window);
                window.fetch = function (input, init) {
                  try {
                    if (typeof input === "string") {
                      return originalFetch(rewriteUrl(input), init);
                    }

                    if (input && typeof input === "object") {
                      var url = input.url;
                      if (typeof url === "string") {
                        var rewritten = rewriteUrl(url);
                        if (rewritten !== url && window.Request) {
                          return originalFetch(new Request(rewritten, input), init);
                        }
                      }
                    }
                  } catch (e) {
                    // fall back
                  }
                  return originalFetch(input, init);
                };
              }
            } catch (e) {
              // best-effort only
            }

            // Patch XHR (covers axios and similar libs).
            try {
              if (window.XMLHttpRequest && window.XMLHttpRequest.prototype) {
                var originalOpen = window.XMLHttpRequest.prototype.open;
                window.XMLHttpRequest.prototype.open = function (method, url) {
                  try {
                    if (typeof url === "string") {
                      url = rewriteUrl(url);
                    }
                  } catch (e) {
                    // fall back
                  }
                  return originalOpen.apply(this, arguments);
                };
              }
            } catch (e) {
              // best-effort only
            }
          })();

          var r = await fetchManifest();
          var manifest = r.manifest;
          var manifestUrl = r.manifestUrl;


          var baseUrl = manifestUrl.replace(/asset-manifest\.json$/, "");
          var entrypoints = manifest.entrypoints || [];

          // CRA `entrypoints` are like: ["static/css/main.<hash>.css", "static/js/main.<hash>.js"].
          for (var i = 0; i < entrypoints.length; i++) {
            var relPath = entrypoints[i].replace(/^\.\//, "");
            var url = baseUrl + relPath;

            if (relPath.endsWith(".css")) {
              injectCss(url);
            } else if (relPath.endsWith(".js")) {
              injectScript(url);
            }
          }
        } catch (e) {
          var el = document.getElementById("pulse-loader-error");
          if (el) {
            el.textContent = String(e);
          }
        }
      }

      loadPulseFrontend();
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <pre id="pulse-loader-error" style="color: #b00020; white-space: pre-wrap;"></pre>
  </body>
</html>
