base_dataiku_applications_metadata:
  description: >
    Inventory of **Dataiku applications** (packaged apps) across DSS instances.
  depends_on: []
  build_order: 40
  sql: |
    CREATE OR REPLACE TABLE "base_dataiku_applications_metadata" AS
    SELECT
          CAST(NULL AS VARCHAR) AS instance_name,
          CAST(NULL AS VARCHAR) AS project_key,
          CAST(NULL AS VARCHAR) AS application_id,
          CAST(NULL AS VARCHAR) AS application_name,
          CAST(NULL AS VARCHAR) AS application_kind,
          CAST(NULL AS VARCHAR) AS owner_login,
          CAST(NULL AS VARCHAR) AS last_modified_by_login,
          CAST(NULL AS TIMESTAMP) AS created_at,
          CAST(NULL AS TIMESTAMP) AS updated_at,
          CAST(NULL AS VARCHAR) AS details_json
    WHERE 1=0;
  example_data: |
    INSERT INTO "base_dataiku_applications_metadata" (instance_name, project_key, application_id, application_name, application_kind, owner_login, last_modified_by_login, created_at, updated_at, details_json) VALUES ('dss-prod', 'FIN', 'application_id_example', 'application_name_example', 'application_kind_example', 'alice', 'alice', TIMESTAMP '2026-03-23 12:00:00', TIMESTAMP '2026-03-23 12:00:00', 'details_json_example');
