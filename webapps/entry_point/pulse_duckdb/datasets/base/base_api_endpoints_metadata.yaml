base_api_endpoints_metadata:
  description: >
    Inventory of **API endpoints** across DSS instances.
  depends_on: []
  build_order: 20
  sql: |
    CREATE OR REPLACE TABLE "base_api_endpoints_metadata" AS
    SELECT
          CAST(NULL AS VARCHAR) AS instance_name,
          CAST(NULL AS VARCHAR) AS project_key,
          CAST(NULL AS VARCHAR) AS api_endpoint_id,
          CAST(NULL AS VARCHAR) AS api_endpoint_name,
          CAST(NULL AS VARCHAR) AS api_service_id,
          CAST(NULL AS VARCHAR) AS api_service_name,
          CAST(NULL AS VARCHAR) AS api_endpoint_kind,
          CAST(NULL AS VARCHAR) AS owner_login,
          CAST(NULL AS VARCHAR) AS last_modified_by_login,
          CAST(NULL AS TIMESTAMP) AS created_at,
          CAST(NULL AS TIMESTAMP) AS updated_at,
          CAST(NULL AS VARCHAR) AS details_json
    WHERE 1=0;
  example_data: |
    INSERT INTO "base_api_endpoints_metadata" (instance_name, project_key, api_endpoint_id, api_endpoint_name, api_service_id, api_service_name, api_endpoint_kind, owner_login, last_modified_by_login, created_at, updated_at, details_json) VALUES ('dss-prod', 'FIN', 'api_endpoint_id_example', 'api_endpoint_name_example', 'api_service_id_example', 'api_service_name_example', 'api_endpoint_kind_example', 'alice', 'alice', TIMESTAMP '2026-03-23 12:00:00', TIMESTAMP '2026-03-23 12:00:00', 'details_json_example');
