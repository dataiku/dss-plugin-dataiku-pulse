datasets_metadata_table:
  description: >
    Deduplicated dataset metadata per instance + project + dataset.
    Incremental rebuild using a rolling hot window based on dataset
    versionTag lastModifiedOn.
    Keeps the most recent dataset record.
  depends_on:
    - datasets_metadata_view

  full_sql: |
    CREATE OR REPLACE TABLE datasets_metadata_base AS
    WITH ranked_datasets AS (
        SELECT
            instance_name,
            project_key,
            dataset_type,
            dataset_managed,
            dataset_featureGroup,
            dataset_name,
            dataset_typeSystemVersion,
            dataset_versionTag_versionNumber,
            dataset_versionTag_lastModifiedBy_login,
            dataset_versionTag_lastModifiedOn,
            dataset_creationTag_versionNumber,
            dataset_creationTag_lastModifiedBy_login,
            dataset_creationTag_lastModifiedOn,
            dataset_smartName,
            ROW_NUMBER() OVER (
                PARTITION BY
                    instance_name,
                    project_key,
                    dataset_name
                ORDER BY
                    dataset_versionTag_lastModifiedOn DESC
            ) AS rn
        FROM datasets_metadata_view
    )
    SELECT
        *
    FROM ranked_datasets
    WHERE rn = 1
    ORDER BY
        instance_name,
        project_key,
        dataset_name;

  incremental_sql: |
    CREATE OR REPLACE TABLE datasets_metadata_base AS
    WITH recent_updates AS (
        SELECT
            instance_name,
            project_key,
            dataset_type,
            dataset_managed,
            dataset_featureGroup,
            dataset_name,
            dataset_typeSystemVersion,
            dataset_versionTag_versionNumber,
            dataset_versionTag_lastModifiedBy_login,
            dataset_versionTag_lastModifiedOn,
            dataset_creationTag_versionNumber,
            dataset_creationTag_lastModifiedBy_login,
            dataset_creationTag_lastModifiedOn,
            dataset_smartName
        FROM datasets_metadata_view
        WHERE
            dataset_versionTag_lastModifiedOn
                >= CURRENT_DATE - INTERVAL 7 DAY
    ),
    existing_gold AS (
        SELECT
            instance_name,
            project_key,
            dataset_type,
            dataset_managed,
            dataset_featureGroup,
            dataset_name,
            dataset_typeSystemVersion,
            dataset_versionTag_versionNumber,
            dataset_versionTag_lastModifiedBy_login,
            dataset_versionTag_lastModifiedOn,
            dataset_creationTag_versionNumber,
            dataset_creationTag_lastModifiedBy_login,
            dataset_creationTag_lastModifiedOn,
            dataset_smartName
        FROM datasets_metadata_base
    ),
    combined AS (
        SELECT * FROM existing_gold
        UNION ALL
        SELECT * FROM recent_updates
    ),
    ranked_datasets AS (
        SELECT
            *,
            ROW_NUMBER() OVER (
                PARTITION BY
                    instance_name,
                    project_key,
                    dataset_name
                ORDER BY
                    dataset_versionTag_lastModifiedOn DESC
            ) AS rn
        FROM combined
    )
    SELECT
        *
    FROM ranked_datasets
    WHERE rn = 1
    ORDER BY
        instance_name,
        project_key,
        dataset_name;
