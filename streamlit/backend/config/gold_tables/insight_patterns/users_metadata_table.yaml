users_metadata_table:
  description: >
    Deduplicated user metadata per instance + login.
    Keeps exactly one row per user based on the most recent
    activity (last session activity or last commit date),
    with deterministic tie-breaking.
    Optimized to avoid full-history window scans.

  depends_on:
    - users_metadata_view

  full_sql: |
    CREATE OR REPLACE TABLE users_metadata_base AS
    WITH activity AS (
        SELECT
            *,
            GREATEST(
                last_session_activity,
                last_commit_date
            ) AS last_activity_ts
        FROM users_metadata_view
    ),
    latest_ts AS (
        SELECT
            instance_name,
            login,
            MAX(last_activity_ts) AS max_activity_ts
        FROM activity
        GROUP BY
            instance_name,
            login
    ),
    filtered AS (
        SELECT a.*
        FROM activity a
        JOIN latest_ts l
          ON a.instance_name = l.instance_name
         AND a.login = l.login
         AND a.last_activity_ts = l.max_activity_ts
    ),
    ranked AS (
        SELECT
            *,
            ROW_NUMBER() OVER (
                PARTITION BY
                    instance_name,
                    login
                ORDER BY
                    last_activity_ts DESC,
                    creationDate DESC
            ) AS rn
        FROM filtered
    )
    SELECT
        instance_name,
        login,
        sourceType,
        displayName,
        userProfile,
        creationDate,
        enabled,
        resultingUserProfile,
        email,
        last_session_activity,
        first_commit_date,
        last_commit_date,
        last_activity_ts
    FROM ranked
    WHERE rn = 1;
