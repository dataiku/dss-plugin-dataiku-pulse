recipes_metadata_table:
  description: >
    Deduplicated recipe metadata per instance + project + recipe.
    Incremental rebuild using a rolling hot window based on
    recipe versionTag lastModifiedOn.
    Keeps the most recent recipe record.
  depends_on:
    - recipes_metadata_view
  sql: |
    CREATE OR REPLACE TABLE recipes_metadata_base AS
    WITH recent_updates AS (
        SELECT
            instance_name,
            project_key,
            recipes_name,
            recipes_type,
            recipes_neverRecomputeExistingPartitions,
            recipes_redispatchPartitioning,
            recipes_maxRunningActivities,
            recipes_hashPropagationBehavior,
            recipes_versionTag_versionNumber,
            recipes_versionTag_lastModifiedBy_login,
            recipes_versionTag_lastModifiedOn,
            recipes_creationTag_versionNumber,
            recipes_creationTag_lastModifiedBy_login,
            recipes_creationTag_lastModifiedOn,
            recipes_params_engineType,
            recipes_params_engineLabel,
            recipes_params_engineRecommended
        FROM recipes_metadata_view
        WHERE
            recipes_versionTag_lastModifiedOn
                >= CURRENT_DATE - INTERVAL 7 DAY
    ),
    existing_gold AS (
        SELECT
            instance_name,
            project_key,
            recipes_name,
            recipes_type,
            recipes_neverRecomputeExistingPartitions,
            recipes_redispatchPartitioning,
            recipes_maxRunningActivities,
            recipes_hashPropagationBehavior,
            recipes_versionTag_versionNumber,
            recipes_versionTag_lastModifiedBy_login,
            recipes_versionTag_lastModifiedOn,
            recipes_creationTag_versionNumber,
            recipes_creationTag_lastModifiedBy_login,
            recipes_creationTag_lastModifiedOn,
            recipes_params_engineType,
            recipes_params_engineLabel,
            recipes_params_engineRecommended
        FROM recipes_metadata_base
    ),
    combined AS (
        SELECT * FROM existing_gold
        UNION ALL
        SELECT * FROM recent_updates
    ),
    ranked_recipes AS (
        SELECT
            *,
            ROW_NUMBER() OVER (
                PARTITION BY
                    instance_name,
                    project_key,
                    recipes_name
                ORDER BY
                    recipes_versionTag_lastModifiedOn DESC
            ) AS rn
        FROM combined
    )
    SELECT
        *
    FROM ranked_recipes
    WHERE rn = 1
    ORDER BY
        instance_name,
        project_key,
        recipes_name;
