actor_capability_subcategory_usage_last_30_days_table:
  description: >
    Aggregated usage counts by actor, instance, canonical capability, and
    underlying Dataiku category over the last 30 days.
    This table supports fast per-actor sub-capability breakdowns and avoids
    scanning raw usage events at query time.
  depends_on:
    - usage_events_view
  sql: |
    CREATE OR REPLACE TABLE actor_capability_subcategory_usage_last_30_days_base AS
    SELECT
        instance_name,
        login,
        canonical_capability,
        dataiku_category,
        COUNT(*) AS event_count
    FROM usage_events_view
    WHERE
        canonical_capability <> 'NON_CORE'
        AND login NOT LIKE 'api:%'
        AND timestamp >= CURRENT_DATE - INTERVAL 30 DAY
    GROUP BY
        instance_name,
        login,
        canonical_capability,
        dataiku_category;
