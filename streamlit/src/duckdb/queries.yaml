# BLOB SETUP FOR AWS, AZURE, GCS
blob_setup:
  aws_modules: INSTALL httpfs; LOAD httpfs;
  aws_headers_assume: |
    CREATE OR REPLACE SECRET duckdb_s3_secret (
      TYPE s3, 
      KEY_ID '{key_id}',
      SECRET '{secret}',
      SESSION_TOKEN '{token}',
      REGION '{aws_region}'
    )
  azure_modules: INSTALL azure; LOAD azure;
  azure_oauth2_headers: |
    CREATE OR REPLACE SECRET duckdb_az_secret (
      TYPE azure,
      PROVIDER service_principal,
      TENANT_ID '{tenant_id}',
      CLIENT_ID '{client_id}',
      CLIENT_SECRET '{client_secret}',
      ACCOUNT_NAME '{account_name}'
    )
  gcp_modules: INSTALL httpfs; LOAD httpfs;
  gcp_headers: |
    CREATE OR REPLACE SECRET duckdb_gs_secret (
        TYPE gcs,
        KEY_ID '{hmac_id}',
        SECRET '{hmac_secret}'
    )

# BASE DATA QUERY
base_data:
  main: |
    CREATE OR REPLACE TABLE {table_name} AS
    SELECT *
    FROM read_parquet([{path_list}], union_by_name = true)

# DATAIKU USAGE QUERY WRAPPER
dataiku_usage: 
  overview: |
    CREATE OR REPLACE TABLE dataiku_usage_overview AS
    SELECT 
      timestamp, callpath, msgtypebase, dataiku_category, instance_name,
      try_cast(project_key AS VARCHAR) AS project_key,
      try_cast(login AS VARCHAR) AS login
    FROM read_parquet({paths}, union_by_name = true)
  module: |
    CREATE OR REPLACE TABLE {table_name} AS
    SELECT *
    FROM read_parquet({paths}, union_by_name = true)

# ADD ON QUERIES FOR MORE COMPLEX AGGRAGATIONS
addon_data:
  metadata_primary_keys: |
    CREATE OR REPLACE TABLE metadata_primary_keys AS
    SELECT UM.instance_name, UM.login, UM.enabled, UM.userprofile, PM.project_key
    FROM users_metadata AS UM
    LEFT JOIN projects_metadata AS PM ON UM.instance_name=PM.instance_name AND UM.login=PM.login
  addon_llm_mapping: |
    CREATE OR REPLACE TABLE addon_llm_mapping AS
    SELECT *
    FROM (
      WITH llm_mesh AS (
        SELECT 
          instance_name,
          project_key,
          agents_versions_toolsUsingAgentSettings_llmId as llms_mesh_id,
          'AGENTS' AS llms_mesh_source
        FROM agents_metadata
        UNION ALL
        SELECT 
          instance_name,
          project_key,
          knowledge_banks_embeddingLLMId as llms_mesh_id,
          'KBS' AS llms_mesh_source
        FROM knowledge_banks_metadata
        UNION ALL
        SELECT 
          instance_name,
          project_key,
          recipes_params_llmid as llms_mesh_id,
          'RECIPES' AS llms_mesh_source
        FROM recipes_metadata
      )
      SELECT 
        llm_mesh.instance_name,
        llm_mesh.project_key,
        llm_mesh.llms_mesh_source,
        llm_mesh.llms_mesh_id,
        llms_metadata.llms_friendlyName,
        llms_metadata.llms_friendlyNameShort,
        SPLIT_PART(llm_mesh.llms_mesh_id, ':', 1) AS llms_conn,
        SPLIT_PART(llm_mesh.llms_mesh_id, ':', 2) AS llms_conn_name,
        SPLIT_PART(llm_mesh.llms_mesh_id, ':', 3) AS llms_model,
        SPLIT_PART(llm_mesh.llms_mesh_id, ':', 4) AS llms_model_version
      FROM llm_mesh
      LEFT JOIN llms_metadata
        ON (llm_mesh.llms_mesh_id = llms_metadata.llms_id
        AND llm_mesh.instance_name = llms_metadata.instance_name)
      WHERE
        llm_mesh.llms_mesh_id <> ''
        AND llm_mesh.llms_mesh_id <> 'False'
    )